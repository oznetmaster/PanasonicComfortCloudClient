name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            framework: net10.0
          - os: windows-latest
            framework: net472
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: oznetmaster/BuildAutomation@cb36bb30b23e58aff85435f23ad0c8428d86ecdd
        env:
          BUILD_FRAMEWORK: ${{ matrix.framework }}
        with:
          task: unit-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.framework }}
          path: artifacts/recipe-tests/${{ matrix.framework }}
  windows-console:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: oznetmaster/BuildAutomation@cb36bb30b23e58aff85435f23ad0c8428d86ecdd
        with:
          task: build
      - name: Verify EditorConfig formatting and code style
        run: |
          dotnet format whitespace PanasonicComfortCloudClient.slnx --no-restore --verify-no-changes
          dotnet format style PanasonicComfortCloudClient.slnx --no-restore --verify-no-changes --severity info
      - name: Verify strict Debug compilation
        run: dotnet build PanasonicComfortCloudClient.slnx -c Debug --no-restore
